[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "marianos-azure-collector"
version = "0.2.1"
description = "Mariano's Azure data collector, validated provider adapter and offline acceptance tests"
requires-python = ">=3.11"
dependencies = []
[project.optional-dependencies]
azure = ["azure-storage-blob>=12.19,<13", "azure-identity>=1.17,<2"]
[project.scripts]
marianos-collector = "marianos_collector.cli:main"
[tool.setuptools.packages.find]
include = ["marianos_collector*"]
